name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # cache: false — no go.sum (stdlib-only project)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: make lint-no-unsafe
      - name: Build static binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o bag ./
          ./bag --list

  conformance:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, alpine, fedora]
    steps:
      - uses: actions/checkout@v4
      - name: Build bag (host)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: CGO_ENABLED=0 go build -trimpath -o bag ./
      - name: Conformance in ${{ matrix.distro }}
        run: |
          docker build -f test/docker/Dockerfile.${{ matrix.distro }} -t bag-test-${{ matrix.distro }} .
          docker run --rm bag-test-${{ matrix.distro }}
